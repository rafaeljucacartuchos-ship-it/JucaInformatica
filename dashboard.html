<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Avançado — Juca</title><link rel="stylesheet" href="style.css?v=7"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}.dash-stat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:1rem}.dash-stat b{display:block;font-size:1.7rem;color:#fff}.dash-stat span{font-size:.8rem;color:#93a5cc}.chart{height:220px;display:flex;align-items:end;gap:4px;padding:1rem 0}.bar{flex:1;min-width:8px;background:linear-gradient(#38bdf8,#2f7df6);border-radius:5px 5px 0 0;position:relative}.bar small{position:absolute;bottom:-1.2rem;left:50%;transform:translateX(-50%);font-size:.6rem;color:#93a5cc}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.list-item{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08);padding:.65rem 0;color:#cdd9f5;font-size:.88rem}.list-item b{color:#fff}@media(max-width:800px){.dash-grid{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}}</style></head><body class="auth-body"><header class="appbar"><div class="appbar-inner"><a href="admin.html"><img src="https://klpbqpcwdhuegcmoqspj.supabase.co/storage/v1/object/public/site/img/logo-header.png" alt="Juca"></a><div class="appbar-user"><div class="who"><strong>Dashboard privado</strong><span id="email"></span></div><button class="btn-exit" id="sair">Sair</button></div></div></header><main class="panel"><div class="panel-title"><div><h1>Monitoramento avançado</h1><p>Comportamento dos visitantes e conversões do site.</p></div><div><select id="periodo" class="btn-mini"><option value="1">Hoje</option><option value="7" selected>7 dias</option><option value="30">30 dias</option><option value="365">Todo período</option></select><button id="
