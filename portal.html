const SUPABASE_URL='https://klpbqpcwdhuegcmoqspj.supabase.co',SUPABASE_KEY='sb_publishable_bPZBZOZQs01sI9yR85lfkg_9wVK41xi',sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const STATUS={orcamento:['Orçamento','fa-file-invoice-dollar'],em_andamento:['Em andamento','fa-gear'],concluido:['Concluído','fa-circle-check'],pausado:['Pausado','fa-pause-circle']};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=i=>i?new Date(i+(i.length===10?'T12:00:00':'')).toLocaleDateString('pt-BR'):'';function card(p){const st=STATUS[p.status]||STATUS.orcamento,pr=Math.max(0,Math.min(100,p.progresso||0));return `<div class="proj-card"><div class="proj-top"><h3>${esc(p.titulo)}</h3><span class="badge ${p.status}"><i class="fas ${st[1]}"></i> ${st[0]}</span></div><p class="desc"><i class="fas fa-lock-open"></i> Acesso ativo</p>${/^https?:\/\//i.test(p.sistema_url||'')?`<a class="auth-btn" href="${esc(p.sistema_url)}" target="_blank" rel="noopener"><i class="fas fa-arrow-up-right-from-square"></i> Acessar sistema</a>`:''}${p.descricao?`<p class="desc">${esc(p.descricao)}</p>`:''}<div class="progress-wrap"><div class="progress-label"><span>Andamento</span><span>${pr}%</span></div><div class="progress"><div style="width:${pr}%"></div></div></div><div class="proj-meta"><span><i class="fas fa-calendar"></i> ${fmt(p.data_inicio)}${p.data_fim?' → '+fmt(p.data_fim):''}</span></div>${p.observacoes?`<p class="proj-notes">${esc(p.observacoes)}</p>`:''}<div class="proj-meta"><span><i class="fas fa-file-lines"></i> Documentos e chamados: gerenciados dentro do sistema</span></div></div>`}
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session)return location.href='login.html';const u=session.user;whoName.textContent=u.user_metadata?.full_name||u.email.split('@')[0];whoEmail.textContent=u.email;btnLogout.onclick=async()=>{await sb.auth.signOut();location.href='login.html'};const {data:prof}=await sb.from('admin_profiles').select('role').eq('id',u.id).maybeSingle();if(prof?.role==='admin'&&u.email?.toLowerCase()==='rafaeljucacartuchos@gmail.com')return location.href='admin.html';const {data:ps,error}=await sb.from('client_projects').select('*').eq('client_user_id',u.id).eq('sistema_ativo',true).order('created_at',{ascending:false});if(error)return grid.innerHTML='<div class="empty">Erro: '+esc(error.message)+'</div>';if(!ps?.length)return grid.innerHTML='<div class="empty"><i class="fas fa-lock"></i>Nenhum sistema ativo liberado para este acesso.</div>';grid.innerHTML=ps.map(card).join('')})();
